# ContractScrolls configuration
maxContractsPerPlayer: 200
maxPendingProposals: 5
proposalCooldownSeconds: 60
# 0 disables expiration. Positive values expire unsigned contracts after N hours.
contractExpiryHours: 0
# How often (seconds) to sweep and persist expired pending contracts.
expirationSweepSeconds: 60
allowThirdPartyWitness: false
# Kept for compatibility; receipt books are currently disabled by design.
receiptBookEnabled: false
# Use "SERVER" to use the server's local timezone, or a ZoneId like "UTC" or "America/New_York".
timezoneDisplay: "SERVER"
# Remove legacy color codes ("§") from contract pages to keep receipts vanilla.
stripColorCodes: true

storage:
  # SQLITE or MYSQL
  # MYSQL mode automatically falls back to SQLITE if MySQL is unavailable.
  mode: SQLITE
  mysql:
    host: "127.0.0.1"
    port: 3306
    database: "contractscrolls"
    username: "root"
    password: "change-me"
    useSsl: false
    table: "contracts"
  sqlite:
    # Relative paths resolve inside plugins/ContractScrolls/
    file: "contracts.db"


