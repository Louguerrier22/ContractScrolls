name: ContractScrolls
main: me.l1cked.contractscrolls.ContractScrollsPlugin
version: ${version}
api-version: '1.21'
description: Vanilla-feeling contract receipts using signed books as terms.
author: l1cked
libraries:
  - org.incendo:cloud-paper:2.0.0-beta.10
  - org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24
  - com.zaxxer:HikariCP:5.1.0
  - com.mysql:mysql-connector-j:8.4.0
  - org.xerial:sqlite-jdbc:3.46.1.3
commands:
  contract:
    description: Contract menu and commands.
    usage: /contract
    aliases: [contracts]
permissions:
  contractscrolls.use:
    description: Use ContractScrolls commands.
    default: true
  contractscrolls.staff:
    description: View/search other players' contracts and integrity warnings.
    default: op
